name: Holy Grail Scan & Deploy

on:
  # Run every weekday at 21:30 UTC (after US market close at 4 PM ET)
  schedule:
    - cron: "30 21 * * 1-5"

  # Allow manual trigger from Actions tab
  workflow_dispatch:

  # Also run when scanner code changes on main
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "generate_data.py"
      - "index.html"
      - ".github/workflows/scan-and-deploy.yml"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Holy Grail scanner
        run: python generate_data.py --output data.json

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp data.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
